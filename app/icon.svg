<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Stackboard</title>
  <defs>
    <linearGradient id="sb-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C8D4"/>
      <stop offset="1" stop-color="#6457F9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#sb-bg)"/>
  <!-- Bottom and middle layers: the stack -->
  <path d="M14 40.5 32 49.5l18-9" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 32.5 32 41.5l18-9" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top layer: the shared board -->
  <path d="M32 14.5 50 23.5 32 32.5 14 23.5Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <!-- Connected nodes on the board -->
  <circle cx="25" cy="23.5" r="2.4" fill="#6457F9"/>
  <circle cx="39" cy="23.5" r="2.4" fill="#00C8D4"/>
  <path d="M27.4 23.5h9.2" stroke="#3A3A9E" stroke-width="1.6" stroke-linecap="round"/>
</svg>
